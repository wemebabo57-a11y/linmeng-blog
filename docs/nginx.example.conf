# ============================================================
# 林梦博客 Nginx 配置示例
# 部署：宝塔面板 → 网站 → 配置文件 → 粘贴到 server 块
# 注意：fastcgi_pass 路径按宝塔实际 PHP 版本调整
#       查看：宝塔 → PHP 管理 → 查看 unix socket 路径
# ============================================================

# 强制 HTTPS 跳转
server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    # SSL 证书路径（在宝塔面板中自动配置）
    # ssl_certificate     /www/server/ssl/example.com/fullchain.pem;
    # ssl_certificate_key /www/server/ssl/example.com/privkey.pem;

    root /www/wwwroot/example.com;
    index index.php index.html;

    # ---- 隐藏敏感文件 ----
    location ~ /\.(env|git|user\.ini|htaccess|trae) {
        deny all;
        return 404;
    }
    location ~ ^/(composer\.(json|lock)|package\.json|\.env) {
        deny all;
        return 404;
    }
    # 核心代码目录禁止直接访问
    location ~ ^/includes/ {
        deny all;
        return 404;
    }
    # Markdown 源文件与文档目录禁止访问
    location ~ ^/(storage|docs)/ {
        deny all;
        return 404;
    }
    # .trae 工作目录
    location ~ ^/\.trae/ {
        deny all;
        return 404;
    }

    # ---- 上传目录禁止执行脚本 ----
    location ~* /assets/uploads/.*\.(php|phtml|pl|py|sh|cgi|asp|aspx)$ {
        deny all;
        return 403;
    }

    # 防目录列举
    autoindex off;

    # ---- 安全头（兜底；CSP 由 PHP 动态设置以保留 nonce 空间） ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 禁用不必要的 HTTP 方法
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) {
        return 405;
    }

    # ---- 静态资源缓存 ----
    location ~* \.(css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- HTML 页面缓存（配合 CDN，如 Cloudflare）----
    # 页面分两类，由 PHP 输出不同的 Cache-Control：
    #
    # 【实时页——绝不进共享缓存】private, no-cache
    #   article.php（评论列表、按 IP 的点赞状态、点赞数）、guestbook.php（留言）。
    #   这些页面含用户实时互动数据，CDN 必须遵守源站头（不要对它们覆盖 Edge TTL）。
    #
    # 【可缓存页——纯静态内容】public, max-age=0, s-maxage=600, stale-while-revalidate=3600
    #   index/tags/archive/about/links/donate/gallery/guide/git 等列表与静态页。
    #   仅对“零互动的纯读者”生效；任何互动过（评论/点赞/留言）的访客都会携带
    #   PHPSESSID，后续所有页面绕过缓存看到实时数据。
    #
    # 源站 Nginx 无需额外配置；要让 CDN 缓存可缓存页，需在 CDN 控制台添加规则：
    #   1) 缓存规则（Cache Rules）：对站点开启“Cache Everything / 缓存所有内容”，
    #      并选择“遵守源站 Cache-Control”（respect origin），确保实时页不被缓存；
    #   2) 例外条件：请求 Cookie 包含 PHPSESSID 时 Bypass cache（绕过缓存），
    #      避免互动过的访客命中缓存页；
    #   3) /admin/、/api/、/login.php、/register.php、/profile.php、/logout.php
    #      及各 OAuth 回调路径加入绕过缓存规则；
    #   4) 文章发布/修改后可在 CDN 控制台清除对应 URL（可缓存页最长 10 分钟自动过期）。

    # ---- 错误页 ----
    error_page 403 /403.php;
    error_page 404 /404.php;
    error_page 500 502 503 504 /50x.html;

    # ---- WAF 白名单提示 ----
    # 若使用宝塔 Nginx 防火墙（WAF），登录表单 POST 中的密码特殊字符
    # （如 ' " < > or select 等）可能被误判为 SQL 注入/XSS，返回 HTTP 444。
    # 已通过 login.php 对密码 base64url 编码传输缓解，如仍被拦截：
    #   宝塔面板 → 软件商店 → Nginx 防火墙 → 站点配置 → URL 白名单
    #   添加：/login.php
    # 同时可在防火墙「POST 过滤」中关闭对 /login.php 的 SQL/XSS 检测。

    # ---- PHP 处理 ----
    location ~ \.php$ {
        # 宝塔默认 socket 路径，按 PHP 版本调整，例如：
        #   PHP 7.4: /tmp/php-cgi-74.sock
        #   PHP 8.0: /tmp/php-cgi-80.sock
        #   PHP 8.1: /tmp/php-cgi-81.sock
        fastcgi_pass unix:/tmp/php-cgi-80.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # 主路由
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
